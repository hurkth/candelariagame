<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Promesa de Candelaria</title>
<meta name="description" content="Promesa de Candelaria: recorre Puno en plena fiesta, cumple la promesa de la abuela Rosa y encuentra sus siete bordados perdidos.">
<meta name="theme-color" content="#120e24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="Promesa de Candelaria">
<meta property="og:description" content="Un juego en el navegador inspirado en la Festividad de la Virgen de la Candelaria, Puno.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>

<div id="loading"><p>Cargando Puno…</p></div>

<!-- HUD -->
<div id="hud" class="hud" hidden>
  <div id="obj">
    <div id="obj-t">Prólogo</div>
    <div id="obj-x"></div>
    <div id="obj-e"></div>
  </div>
  <div id="bars">
    <div class="meter" id="air-w"><span>Aire</span><div class="bar"><i id="air-i"></i></div></div>
    <div class="meter" id="ch-w" hidden><span>Chisme</span><div class="bar"><i id="ch-i"></i></div></div>
  </div>
  <div id="tr">
    <div class="row">
      <button class="iconbtn" id="btn-photo" aria-label="Modo foto"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 4 7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg></button>
      <button class="iconbtn" id="btn-menu" aria-label="Menú"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
    </div>
    <canvas id="minimap" width="220" height="220"></canvas>
    <div class="chip"><span class="bell"></span><b id="cas-n">0</b></div>
  </div>
  <div id="timer" hidden></div>
  <div id="toast" hidden></div>
  <div id="big" hidden></div>
  <div id="arrow" hidden></div>
</div>

<!-- Controles táctiles -->
<div id="controls" hidden>
  <div id="joyzone"></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="btns">
    <button id="btn-b" class="act b"><span id="btn-b-l">Salto</span></button>
    <button id="btn-a" class="act a"><span id="btn-a-l">Hablar</span></button>
  </div>
</div>

<!-- Diálogo -->
<div id="dialog" hidden>
  <div class="dlg">
    <div id="dlg-por">R</div>
    <div class="dlg-body"><div id="dlg-who">Rosa</div><div id="dlg-txt"></div></div>
    <div class="dlg-next">▼</div>
  </div>
</div>

<div id="card" hidden><div id="card-t"></div><div id="card-s"></div></div>
<div id="rhythm" hidden><canvas id="rcv"></canvas></div>
<div id="photo" hidden>
  <div class="ph-top"><span>Modo foto · arrastra para girar</span><button class="btn small" id="ph-exit">Salir</button></div>
  <div class="ph-bottom">
    <div class="ph-poses"><button class="btn small" data-pose="paso">Paso</button><button class="btn small" data-pose="saludo">Saludo</button><button class="btn small" data-pose="salto">Salto</button></div>
    <button id="ph-shot" aria-label="Tomar foto"></button>
  </div>
</div>
<div id="modal" hidden></div>

<!-- Pantalla de título -->
<div id="title" hidden>
  <div class="t-inner">
    <p class="t-kicker">Puno · 3,827 msnm · febrero</p>
    <h1>Promesa de <span>Candelaria</span></h1>
    <p class="t-sub">La abuela Rosa ya no puede bailar. Te deja su promesa y un pañuelo al que le faltan siete bordados.</p>
    <div class="t-btns">
      <button id="t-play" class="btn primary">Jugar</button>
      <button id="t-daily" class="btn" hidden>Ensayo del día</button>
      <button id="t-new" class="btn ghost" hidden>Nuevo juego</button>
    </div>
    <p class="t-foot">Mejor con sonido · Un juego de <a href="https://candelariacentral.com" target="_blank" rel="noopener">candelariacentral.com</a></p>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
